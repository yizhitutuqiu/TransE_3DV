paths:
  data_dir: data/preprocessed/final
  entity2id_path: data/preprocessed/final/entity2id.txt
  documents_path: data/preprocessed/text/documents.jsonl
  triples_paths:
    - data/preprocessed/final/triples_train.jsonl
    - data/preprocessed/final/triples_test.jsonl
  out_dir: data/vis/gephi

sample:
  mode: stratified_by_type
  per_type_limit: 800
  types:
    - Paper
    - Method
    - Repo
    - Dataset
  seed: 42

gephi:
  nodes_csv: nodes.csv
  edges_csv: edges.csv
