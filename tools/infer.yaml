model:
  ckpt_path: /data/litengmo/ml-test-1/zstp_final/checkpoints/transe_v1/best.pt
  embedding_dim: 100
  p_norm: 1
  device: cpu
data:
  data_dir: /data/litengmo/ml-test-1/zstp_final/data/preprocessed/final
infer:
  top_k: 10
  batch_size: 512
  filtered: true
output:
  out_root: /data/litengmo/ml-test-1/zstp_final/output/infer
queries:
  - type: tail
    h: Repo:varyshare/easy_slam_tutorial
    r: repo_implements_method
    k: 10
  - type: tail
    h: Method:nerf
    r: method_uses_dataset
    k: 10
  - type: score
    h: Repo:varyshare/easy_slam_tutorial
    r: repo_implements_method
    t: Method:贝叶斯滤波
